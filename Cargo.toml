[package]
name = "hnu-dorm-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "MCP server for querying Hunan University dormitory electricity"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync"
] }
hnu_query = "=5.1.0"
rmcp = { version = "0.17", features = [
    "server",
    "macros",
    "schemars",
    "transport-io"
] }
schemars = "1.2"